<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#ffffff"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">What counts as a hands-on GEO model</text><rect x="70" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="195" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">Business owner /</text><text x="195" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">executive</text><rect x="475" y="130" width="250" height="170" rx="20" fill="#eaf2ee" stroke="#1f4d3f" stroke-width="2"/><text x="600" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">Specific</text><text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">senior GEO expert</text><text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#374151">personal strategy and responsibility</text><rect x="880" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="1005" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#111827">Implementation</text><text x="1005" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">website · content · PR ·</text><text x="1005" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">analytics · monitoring</text><path d="M320 215 H465" stroke="#1f4d3f" stroke-width="5"/><polygon points="465,215 445,203 445,227" fill="#1f4d3f"/><path d="M725 215 H870" stroke="#1f4d3f" stroke-width="5"/><polygon points="870,215 850,203 850,227" fill="#1f4d3f"/><text x="395" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">direct contact</text><text x="798" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">personal control</text><text x="70" y="370" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Why this is a separate scenario</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="21" fill="#374151">A large team may be stronger for an enterprise project, but this ranking answers a different question:</text><text x="70" y="458" font-family="Arial,sans-serif" font-size="21" fill="#374151">how directly a business can work with a specific expert and receive that person's involvement.</text><rect x="70" y="510" width="1060" height="2" fill="#e5e7eb"/><text x="70" y="555" font-family="Arial,sans-serif" font-size="19" fill="#6b7280">That is why 50 of 100 points cover direct work, personal responsibility and breadth of personally controlled tasks.</text></svg>